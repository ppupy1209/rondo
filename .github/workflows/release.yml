name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag and tests
        run: |
          version=$(python3 bin/rondo --version | awk '{print $2}')
          test "$GITHUB_REF_NAME" = "v$version"
          python3 -m unittest discover -s tests -v
      - name: Build immutable archives
        run: |
          version=$(python3 bin/rondo --version | awk '{print $2}')
          mkdir dist
          git archive --format=tar.gz --prefix="rondo-$version/" -o dist/rondo.tar.gz HEAD
          git archive --format=zip --prefix="rondo-$version/" -o dist/rondo.zip HEAD
          cd dist
          sha256sum rondo.tar.gz rondo.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/rondo.tar.gz dist/rondo.zip dist/SHA256SUMS --generate-notes --verify-tag
