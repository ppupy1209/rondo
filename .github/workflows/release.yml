name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag and tests
        run: |
          version=$(python3 bin/rondo --version | awk '{print $2}')
          test "$GITHUB_REF_NAME" = "v$version"
          python3 scripts/check_identity.py --all
          python3 -m py_compile bin/rondo bin/rondo-agent-session bin/rondo-relay lib/rondo/core.py lib/rondo/cleanup.py
          python3 -m unittest discover -s tests -v
          sh -n install.sh
      - name: Build immutable archives
        run: |
          version=$(python3 bin/rondo --version | awk '{print $2}')
          mkdir dist
          git archive --format=tar.gz --prefix="rondo-$version/" -o dist/rondo.tar.gz HEAD
          git archive --format=zip --prefix="rondo-$version/" -o dist/rondo.zip HEAD
          cd dist
          sha256sum rondo.tar.gz rondo.zip > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/rondo.tar.gz
            dist/rondo.zip
            dist/SHA256SUMS
      - name: Publish immutable-ready GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/rondo.tar.gz dist/rondo.zip dist/SHA256SUMS --draft --generate-notes --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false
