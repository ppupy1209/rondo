name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Python checks
        run: |
          python3 -m py_compile bin/rondo bin/rondo-agent-session bin/rondo-lens bin/rondo-relay bin/rondo-claude-status bin/ai-status
          python3 -m unittest discover -s tests -v
      - name: Shell checks
        run: |
          sh -n install.sh bin/ai bin/rondo-status bin/claude-statusline bin/*-session bin/handoff
          RONDO_HOME="$RUNNER_TEMP/rondo-home" sh install.sh
          RONDO_HOME="$RUNNER_TEMP/rondo-home" sh install.sh
      - name: Real Zellij delivery and restart
        run: |
          export PATH="$RUNNER_TEMP/rondo-home/.local/bin:$PATH"
          python3 tests/zellij_smoke.py

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python checks
        run: |
          python -m py_compile bin/rondo bin/rondo-agent-session bin/rondo-lens bin/rondo-relay bin/rondo-claude-status bin/ai-status
          python -m unittest discover -s tests -v
      - name: PowerShell installer
        shell: pwsh
        run: |
          ./install.ps1
          $env:Path = "$env:LOCALAPPDATA\Rondo\bin;$env:Path"
          rondo --version
