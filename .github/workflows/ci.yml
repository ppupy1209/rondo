name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Commit identity policy
        run: python3 scripts/check_identity.py --all
      - name: Python checks
        run: |
          python3 -m py_compile bin/rondo bin/rondo-agent-session bin/rondo-relay lib/rondo/core.py lib/rondo/cleanup.py
          python3 -m unittest discover -s tests -v
      - name: Shell checks
        run: |
          sh -n install.sh
          RONDO_HOME="$RUNNER_TEMP/rondo-home" sh install.sh
          RONDO_HOME="$RUNNER_TEMP/rondo-home" sh install.sh
      - name: Real Rondo tabs and visible delivery
        run: |
          export PATH="$RUNNER_TEMP/rondo-home/.local/bin:$PATH"
          python3 tests/zellij_smoke.py

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Commit identity policy
        run: python scripts/check_identity.py --all
      - name: Python checks
        run: |
          python -m py_compile bin/rondo bin/rondo-agent-session bin/rondo-relay lib/rondo/core.py lib/rondo/cleanup.py
          python -m unittest discover -s tests -v
      - name: PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
          ./install.ps1
          $env:Path = "$env:LOCALAPPDATA\Rondo\bin;$env:Path"
          rondo --version
      - name: Windows Rondo tabs and visible delivery
        shell: pwsh
        run: ./tests/zellij_windows_smoke.ps1
